<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>fontstyle</title>
    <style>
        h1{
            font-style: italic;
            font-weight: bold;
            font-size: 33px;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        p{
            font-style: italic;
            font-weight: bolder;
            font: size 45px; 
            font-family: 'Times New Roman', Times, serif;
        }
        a:link{
            color: blue;
        } 
        a:visted{
            color: crimson;
        }
        a:hover{
            color:brown;
        } 
        a:active{
            color:rgb(88, 5, 165);
        }
       

        
        </style>
</head>
<body>
    <h1>Welcome </h1>
    <p>This is my web page</p>

    <a href="https://www.youtube.com/">YOUTUBE</a>
    
</body>
</html>
