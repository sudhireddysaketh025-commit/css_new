<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
    <style>
        .parent{
            position: relative;
            width: 400px;
            height: 250px;
            background-color: darkcyan;
        }
        .child{
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 60px;
            background-color: aqua;
        }

    </style>
</head>
<body>
    <div class="parent">Parent box
    <div class="child">Child</div>
    </div>
</body>
</html>
